name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    name: Build Mobile Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        run: cd mobile && yarn install --frozen-lockfile

      - name: Build
        run: cd mobile && yarn build
